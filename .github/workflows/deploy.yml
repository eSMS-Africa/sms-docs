name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Production deploys are done by the server-side pull deployer (esms-infra/deployer, every minute
# from main), NOT by Actions. The old SSH deploy steps were removed 2026-10-29: the ec2-user
# CI key is gone, so they failed every run and kept CI red. CI now only tests/builds.
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: out/
          retention-days: 1
